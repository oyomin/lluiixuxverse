<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lluiixuxverse</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
      <nav class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Memories</a>
  </nav>
    <header>
        <div class="player">
            <h3>Secret Door</h3>
            <img src="/img/arcticmonkeys.jpg" alt="arctic monkeys" class="imag">
            <div class="buttons">
                <button id="playBtn">play</button>
                <button id="stopBtn">stop</button>
            </div>

            <div class="volume">
                <span>-</span>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
                <span>+</span>
            </div>
        </div>
        <audio id="bgm" src="img/SecretDoor.mp3" loop preload="auto"></audio>
    </header>
    <main>
        <div id="skin-viewer"></div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/main.js"></script>
</body>

</html>
